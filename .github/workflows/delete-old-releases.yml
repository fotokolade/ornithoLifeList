# One-off: deletes every release and every v* tag, so the history can be rewritten without the old
# tags keeping the old commits alive. Run it by hand, then the Release workflow; then delete this file.
name: Delete old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete the releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
      - name: Delete the remaining v* tags
        run: |
          git fetch --force --tags
          for tag in $(git tag -l 'v*'); do
            echo "Deleting tag $tag"
            git push origin --delete "refs/tags/$tag"
          done

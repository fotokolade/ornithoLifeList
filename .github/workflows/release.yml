# Builds lifelist.exe on Windows and publishes a GitHub release whenever a version tag is pushed.
# Release steps: bump APP_VERSION in src/i18n.js, commit, then push an annotated tag whose message
# holds the release notes:  git tag -a v0.3.0 -F notes.md && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # a tag checkout doesn't bring the annotated tag object; its message becomes the release notes
      - run: git fetch --force --tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Check that the tag matches APP_VERSION
        shell: bash
        run: |
          v=$(python -c "import lifelist; print(lifelist.app_version())")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $v in src/i18n.js"; exit 1; fi
      - name: Build (runs the tests first)
        run: python build.py
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(cut -d' ' -f1 dist/lifelist.exe.sha256)
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo
            echo "### Prüfsumme"
            echo
            echo "SHA256 von \`lifelist.exe\`: \`$sum\`"
            echo
            echo "Zum Prüfen \`lifelist.exe\`, \`lifelist.exe.sha256\`, \`verify.bat\` und \`verify.ps1\` in einen Ordner legen und \`verify.bat\` doppelklicken (siehe README)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/lifelist.exe dist/lifelist.exe.sha256 verify.bat verify.ps1

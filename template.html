<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Lebensliste</title>
<style>
:root{
  --bg:#f7f8f6; --card:#ffffff; --text:#1d2521; --muted:#6a746e; --line:#e4e8e4;
  --accent:#2f8f4e; --accent-soft:#eaf4ed; --bar:#4a86b6; --bar-soft:#dbe7f0;
  --hl:#fff7cc; --link:#3d6a8c; --stripe:#f6f8f5;
  --k1:#2f8f4e; --k2:#c98a1b; --k3:#3d78a8; --k4:#8659b3; --k5:#c1554a; --k6:#2f9e93;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1b201d; --text:#e8ece9; --muted:#96a19a; --line:#2c332f;
    --accent:#4cc275; --accent-soft:#1f3327; --bar:#5b9bcf; --bar-soft:#2b3b48;
    --hl:#3b3717; --link:#8ab8dc; --stripe:#202622;
    --k1:#4cc275; --k2:#e0a23c; --k3:#5b9bcf; --k4:#b28ee0; --k5:#e08578; --k6:#4cc2b3;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 44px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding-top:8px}
h1{font-size:1.05rem;margin:0}
.sub{color:var(--muted);font-size:.78rem;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
select,input[type=search]{font:inherit;font-size:.82rem;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);color:var(--text);max-width:100%}
input[type=search]{min-width:0;flex:1 1 200px}
details.opts{font-size:.8rem;color:var(--muted)}
details.opts summary{cursor:pointer}
details.opts label{display:block;margin:5px 0}
nav.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav.tabs button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--muted);
  padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
section.tab{display:none;padding-top:16px}
section.tab.on{display:block}
h2{font-size:.92rem;margin:26px 0 8px}
h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.prose{color:var(--muted);font-size:.78rem;text-align:justify;hyphens:auto;margin:3px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--k3);border-radius:9px;padding:10px 14px}
.kpi:nth-child(6n+1){border-top-color:var(--k1)}
.kpi:nth-child(6n+2){border-top-color:var(--k2)}
.kpi:nth-child(6n+3){border-top-color:var(--k3)}
.kpi:nth-child(6n+4){border-top-color:var(--k4)}
.kpi:nth-child(6n+5){border-top-color:var(--k5)}
.kpi:nth-child(6n+6){border-top-color:var(--k6)}
.kpi b{display:block;font-size:1.3rem;line-height:1.2}
.kpi span{color:var(--muted);font-size:.74rem;line-height:1.25;display:block;margin-top:1px}
.kpi.main b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;overflow-x:auto}
.yhead,.yrow{display:grid;grid-template-columns:2.6rem 4.2rem 1fr 3rem 2.6rem;gap:8px;align-items:center;padding:4px 6px}
.yhead{color:var(--muted);font-size:.72rem;padding-top:6px}
.yrow{border-radius:6px}
.yrow.cur{background:var(--hl)}
.yrow .y{font-weight:600}
.yrow .ytd{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.yrow .tot{color:var(--accent);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.yrow .new{color:var(--muted);text-align:right;font-size:.78rem;font-variant-numeric:tabular-nums}
.yhead span:nth-child(2),.yhead span:nth-child(4),.yhead span:nth-child(5){text-align:right}
.bar{height:10px;background:var(--bar-soft);border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--bar) 45%,transparent),var(--bar))}
.yrow.cur .bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent))}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;
  padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}
th.sorted{color:var(--text)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd) td{background:var(--stripe)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nr{color:var(--muted);width:2rem}
table.rtable{table-layout:fixed}
table.rtable .nr{width:2.2rem}
table.rtable .num{width:4.5rem}
table.rtable td:not(.nr):not(.num),table.rtable th:not(.nr):not(.num){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.latin{color:var(--muted);font-style:italic;font-size:.74rem;display:block;line-height:1.2}
.small{color:var(--muted);font-size:.74rem;display:block;line-height:1.2}
button.lnk{color:var(--link);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-align:left}
button.lnk:hover{text-decoration:underline}
tr.row{cursor:pointer}
tr.detail td{background:var(--accent-soft)!important;padding:8px}
.pheno{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:54px;max-width:360px}
.pheno div{background:var(--bar);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.pheno-l{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:360px;font-size:.66rem;color:var(--muted);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.74rem}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.heat td,.heat th{text-align:center;padding:3px 2px;font-size:.72rem}
.heat td.y{text-align:left;font-weight:600;padding-left:4px}
.heat td{border:1px solid var(--card);border-radius:3px}
.time-chip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.new-badge{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;font-size:.62rem;font-weight:700;margin-left:6px;vertical-align:middle}
.cal-months-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.cal-month h4{margin:0 0 5px;font-size:.76rem;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:.6rem;color:var(--muted);text-align:center;line-height:1.6}
.cal-day{aspect-ratio:1;border-radius:2px;background:var(--bar-soft)}
.cal-day.cal-lifer{box-shadow:0 0 0 1.5px var(--accent) inset}
.cal-day.cal-empty{background:transparent}
svg.curve{width:100%;height:auto;display:block}
svg.curve text{fill:var(--muted);font-size:11px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.empty{color:var(--muted);padding:10px 4px}
.more{margin:8px 0 2px}
#map{height:66vh;min-height:340px;border-radius:8px;border:1px solid var(--line)}
.leaflet-popup-content{font:13px/1.35 system-ui,sans-serif;color:#1d2521}
.leaflet-popup-content .visits{max-height:190px;overflow:auto;margin-top:6px;border-top:1px solid #e4e8e4;padding-top:4px}
.leaflet-popup-content .visits details{margin:2px 0}
.leaflet-popup-content .visits summary{cursor:pointer}
.leaflet-popup-content .visits ul{margin:2px 0 4px;padding-left:18px}
.marker-cluster-custom{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.marker-cluster-custom div{background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12px/1 system-ui,sans-serif;width:100%;height:100%}
.m-year{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:180px}
.m-year input[type=range]{flex:1;accent-color:var(--accent)}
.m-year span{font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.6em}
@media (max-width:700px){
  .hide-sm{display:none}
  header.top{position:static}
  #h-sub{display:none}
  .yhead,.yrow{grid-template-columns:2.4rem 2.8rem 1fr 2.6rem 2.2rem;gap:4px}
}
.ab{display:inline-block;min-width:1.9rem;text-align:center;border-radius:5px;padding:0 5px;font-size:.74rem;font-weight:600;color:#fff}
.ab-A{background:#8a949d}.ab-B{background:#d18a1b}.ab-C{background:#2f8f4e}
.btn{font:inherit;font-size:.82rem;padding:3px 10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.legend{display:flex;align-items:center;gap:8px;margin:6px 2px 14px;font-size:.72rem;color:var(--muted)}
.legend .grad{flex:0 0 90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--k3),var(--accent))}
.propbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 2px 6px}
.propbar div{height:100%}
.hbar{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.hbar-row{display:grid;grid-template-columns:minmax(0,9rem) 1fr 2.4rem;gap:10px;align-items:center;font-size:.8rem}
.hbar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.printonly{display:none}
@page{size:A4;margin:14mm}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#111;--muted:#555;--line:#ccc;--accent:#1f7a3d;--accent-soft:#eef6f0;
    --bar:#3d78a8;--bar-soft:#d3e2ee;--hl:#fff;--link:#111;--stripe:#f5f5f5}
  body{font-size:10pt}
  header.top{position:static;border:0}
  .filters,nav.tabs,.pick,#tab-map,.more{display:none!important}
  .printonly{display:block}
  section.tab{display:block!important;padding-top:0}
  .wrap{max-width:none;padding:0}
  .card{overflow:visible;border-color:var(--line)}
  tr,.yrow,.kpi{break-inside:avoid}
  h2{break-after:avoid;margin-top:14px}
  #tab-list,#tab-regions,#tab-targets,#tab-activity{break-before:page}
  tr.row{cursor:auto}
  .hide-sm{display:revert!important}
  th.hide-sm,td.hide-sm{display:table-cell!important}
  .bar,.bar i,.heat td,.pheno div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 id="h-title"></h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <p class="sub printonly" id="h-print"></p>
    <div class="filters">
      <select id="f-lang" aria-label="Language / Sprache">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
      <select id="f-region" aria-label="Region"></select>
      <select id="f-year" aria-label="Jahr"></select>
      <select id="f-month" aria-label="Monat"></select>
      <details class="opts">
        <summary id="o-sum"></summary>
        <label><input type="checkbox" id="o-escaped"> <span id="o-escaped-t"></span></label>
        <label><input type="checkbox" id="o-collective"> <span id="o-collective-t"></span></label>
        <label id="o-redact-l"><input type="checkbox" id="o-redact"> <span id="o-redact-t"></span></label>
      </details>
      <button class="btn" id="b-pdf" type="button"></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-list">
    <div class="pick">
      <input type="search" id="q" autocomplete="off">
      <select id="q-sort" aria-label="Sortierung"></select>
      <select id="q-atlas" aria-label="Brutzeitcode"></select>
    </div>
    <div class="card" id="list-out"></div>
  </section>
  <section class="tab" id="tab-regions"></section>
  <section class="tab" id="tab-targets"></section>
  <section class="tab" id="tab-activity">
    <div class="pick">
      <select id="a-metric" aria-label="Wert"></select>
      <select id="a-scope" aria-label="Zeitraum"></select>
    </div>
    <div id="act-out"></div>
  </section>
  <section class="tab" id="tab-map">
    <div class="pick">
      <select id="m-metric" aria-label="Kartenwert"></select>
      <span class="m-year"><input type="range" id="m-year" step="1"><span id="m-year-val"></span></span>
    </div>
    <div id="map"></div>
    <p class="prose" id="map-note"></p>
  </section>
</main>

const RAW = JSON.parse(document.getElementById("data").textContent);
const SP = RAW.sp.map(([name, latin, order, flags]) => ({ name, latin, order, flags }));
const PL = RAW.pl.map(([name, muni, state, county, lat, lon], i) => {
  const s = state || "?", c = s + "/" + (county || "?");
  return { i, name, muni, state, county, lat, lon,
    keys: { s, c, m: c + "/" + muni, p: String(i) } };
});
const NOW = new Date();
const TODAY_Y = NOW.getFullYear(), TODAY_M = NOW.getMonth() + 1;
const pad = n => String(n).padStart(2, "0");
const TODAY_MD = pad(TODAY_M) + "-" + pad(NOW.getDate());
const atlasRank = ac => /^[ABC]/.test(ac) ? (parseInt(ac.slice(1), 10) || { A: 1, B: 3, C: 10 }[ac[0]]) : 0;  // E99 and unknown prefixes are no breeding evidence
const OBS = RAW.obs.map(([s, d, p, c, ph, ac, tm]) => {
  const md = d.slice(5);
  return { s, d, y: +d.slice(0, 4), m: +d.slice(5, 7), md, p, c, ph, ac, tm, ar: ac ? atlasRank(ac) : 0 };
});
const YEARS = [...new Set(OBS.map(o => o.y))].sort((a, b) => a - b);
const MIN_Y = YEARS[0], MAX_Y = YEARS[YEARS.length - 1];

const initialLang = (() => {
  try { return localStorage.getItem("lifelist-lang") === "en" ? "en" : "de"; } catch (e) { return "de"; }
})();
const S = { tab: "overview", region: "all", year: Math.min(TODAY_Y, MAX_Y), month: TODAY_M, lang: initialLang,
  escaped: false, collective: false, atlasF: "all", actMetric: "obs", actScope: "all", redact: !!RAW.meta.redacted, metric: "life", q: "", sort: "nr", dir: -1, open: new Set(),
  regSort: {}, regAll: {}, targetSrc: "all", customTargets: loadCustomTargets() };
T = STR[S.lang];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtN = n => n.toLocaleString(S.lang === "en" ? "en-GB" : "de-DE");
// rounds for display but never claims 100% unless truly complete, or 0% when something is actually there
const pctDisplay = (count, total) => !total ? 0 : count === 0 ? 0 : count === total ? 100 : Math.min(99, Math.max(1, Math.round(count / total * 100)));
const fmtD = d => d.slice(8) + "." + d.slice(5, 7) + "." + d.slice(0, 4);
const shortMD = md => (+md.slice(3)) + ". " + T.monthsShort[+md.slice(0, 2) - 1];
const byDateDesc = (a, b) => (a < b ? 1 : a > b ? -1 : 0);
const REDACT_MASK = "██████████";
const placeName = i => S.redact ? REDACT_MASK : PL[i].name;
const stateName = c => T.states[c] || (c === "?" ? T.unknown : c);
const countyName = key => COUNTIES[key] || (key.split("/")[1] === "?" ? T.unknown : key.split("/")[1]);
let collator = new Intl.Collator(S.lang === "en" ? "en" : "de");

function baseObs() {
  return OBS.filter(o => {
    const f = SP[o.s].flags;
    return !((f & 1) && !S.escaped) && !((f & 2) && !S.collective);
  });
}
function regionObs(list) {
  if (S.region === "all") return list;
  const [lvl, key] = [S.region[0], S.region.slice(2)];
  return list.filter(o => PL[o.p].keys[lvl] === key);
}
function speciesStats(list) {
  const m = new Map();
  for (const o of list) {
    let r = m.get(o.s);
    if (!r) {
      r = { s: o.s, first: o, last: o, n: 0, max: 0, years: new Map(), months: Array(12).fill(0),
        places: new Map(), photos: 0, obs: [], ar: 0, ac: "", codes: new Map(), acObs: null };
      m.set(o.s, r);
    }
    r.last = o; r.n++; r.obs.push(o);
    if (o.c > r.max) r.max = o.c;
    r.years.set(o.y, (r.years.get(o.y) || 0) + 1);
    r.months[o.m - 1]++;
    r.places.set(o.p, (r.places.get(o.p) || 0) + 1);
    r.photos += o.ph;
    if (o.ac) { r.codes.set(o.ac, (r.codes.get(o.ac) || 0) + 1); if (o.ar > r.ar) { r.ar = o.ar; r.ac = o.ac; r.acObs = o; } }
  }
  return m;
}

/* ---------- overview ---------- */
// Distinct species per year (whole year and up to today's date); `keep` narrows the observations, e.g. to one month.
function yearSets(list, keep = () => true) {
  const ys = new Map();
  for (let y = MIN_Y; y <= MAX_Y; y++) ys.set(y, { y, all: new Set(), ytd: new Set(), lifers: 0 });
  for (const o of list) {
    if (!keep(o)) continue;
    const r = ys.get(o.y);
    r.all.add(o.s);
    if (o.md <= TODAY_MD) r.ytd.add(o.s);
  }
  return [...ys.values()].sort((a, b) => b.y - a.y);
}
function yearRows(list, stats) {
  const rows = yearSets(list);
  for (const st of stats.values()) rows.find(r => r.y === st.first.y).lifers++;
  return rows;
}
const monthRows = list => yearSets(list, o => o.m === S.month);
function renderYearBlock(rows, opts) {
  const max = Math.max(1, ...rows.map(r => r.all.size));
  const head = `<div class="yhead"><span>${t("colYear")}</span><span>${opts.showYtd ? t("colUntil", shortMD(TODAY_MD)) : ""}</span><span></span><span>${t("colTotal")}</span><span>${opts.showNew ? t("colNew") : ""}</span></div>`;
  return `<div class="card">${head}` + rows.map(r => {
    const tot = r.all.size, ytd = r.ytd.size;
    const cur = r.y === S.year ? " cur" : "";
    const wTot = tot / max * 100, wYtd = opts.showYtd ? ytd / max * 100 : wTot;
    const c = r.y === S.year ? "var(--accent)" : `var(${CHART_PALETTE[(r.y - MIN_Y) % CHART_PALETTE.length]})`;
    const grad = `linear-gradient(90deg,color-mix(in srgb,${c} 45%,transparent),${c})`;
    return `<div class="yrow${cur}"><span class="y">${r.y}</span>
      <span class="ytd">${opts.showYtd ? ytd : ""}</span>
      <div class="bar"><i style="width:${wYtd}%;background:${grad}"></i>${opts.showYtd ? `<i style="width:${wTot}%;opacity:.28;background:${grad}"></i>` : ""}</div>
      <span class="tot">${tot}</span>
      <span class="new">${opts.showNew && r.lifers ? "+" + r.lifers : ""}</span></div>`;
  }).join("") + `</div>`;
}
// One numbering for every view: first sighting date, ties by taxonomic order.
function numberLifers(stats) {
  const chrono = [...stats.values()].sort((a, b) => (a.first.d < b.first.d ? -1 : a.first.d > b.first.d ? 1 : 0) || SP[a.s].order - SP[b.s].order);
  chrono.forEach((r, i) => { r.nr = i + 1; });
  return chrono;
}
function curveSvg(chrono) {
  const pts = chrono.map(r => r.first);
  if (!pts.length) return "";
  const W = 720, H = 230, L = 38, R = 10, Tp = 10, B = 24;
  const t0 = Date.UTC(MIN_Y, 0, 1), t1 = Date.UTC(Math.max(MAX_Y, TODAY_Y) + 1, 0, 1);
  const x = ms => L + (ms - t0) / (t1 - t0) * (W - L - R);
  const mag = Math.pow(10, Math.floor(Math.log10(pts.length)));
  const step = Math.max(1, mag / (pts.length / mag < 2.5 ? 2 : 1));
  const yMax = Math.ceil(pts.length / step) * step;
  const y = n => H - B - n / yMax * (H - B - Tp);
  const yearColor = yr => `var(${CHART_PALETTE[(yr - MIN_Y) % CHART_PALETTE.length]})`;
  let g = "", d = `M${x(t0)},${y(0)}`, prev = 0, dots = "";
  for (let v = 0; v <= yMax; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const every = (Math.max(MAX_Y, TODAY_Y) - MIN_Y) > 8 ? 2 : 1;
  for (let yr = MIN_Y; yr <= Math.max(MAX_Y, TODAY_Y); yr += every)
    g += `<text x="${x(Date.UTC(yr, 0, 1)) + 2}" y="${H - 6}">${yr}</text>`;
  pts.forEach((o, i) => {
    const ms = Date.parse(o.d + "T00:00:00Z");
    d += ` L${x(ms)},${y(prev)} L${x(ms)},${y(i + 1)}`;
    prev = i + 1;
    const cur = o.y === S.year;
    dots += `<circle cx="${x(ms)}" cy="${y(i + 1)}" r="${cur ? 4.5 : 2.5}" fill="${cur ? "var(--accent)" : yearColor(o.y)}" stroke="var(--card)" stroke-width="${cur ? 1.5 : 1}"><title>${i + 1}. ${esc(SP[o.s].name)}, ${fmtD(o.d)}</title></circle>`;
  });
  const baseline = ` L${x(Date.now())},${y(0)} L${x(t0)},${y(0)} Z`;
  const area = d + ` L${x(Date.now())},${y(prev)}` + baseline;
  d += ` L${x(Date.now())},${y(prev)}`;
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("curve")}">
    <defs>
      <linearGradient id="curveGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="curveLine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--k3)"/>
        <stop offset="100%" stop-color="var(--accent)"/>
      </linearGradient>
    </defs>
    ${g}<path d="${area}" fill="url(#curveGrad)" stroke="none"/><path d="${d}" fill="none" stroke="url(#curveLine)" stroke-width="2.25" stroke-linejoin="round"/>${dots}</svg>`;
}
// shared cool-to-warm intensity scale, reused by the heatmaps and the map markers
function heatColor(frac) {
  return `color-mix(in srgb, var(--accent) ${Math.round(15 + Math.max(0, Math.min(1, frac)) * 85)}%, var(--k3))`;
}
function heatLegend(max) {
  return `<div class="legend"><span>0</span><div class="grad"></div><span>${max}</span></div>`;
}
function heatTable(list) {
  const cell = new Map();
  for (const o of list) {
    const k = o.y * 100 + o.m;
    if (!cell.has(k)) cell.set(k, new Set());
    cell.get(k).add(o.s);
  }
  let max = 1;
  for (const s of cell.values()) max = Math.max(max, s.size);
  let h = `<table class="heat"><thead><tr><th></th>${T.monthsShort.map(m => `<th>${m.replace(".", "")}</th>`).join("")}</tr></thead><tbody>`;
  for (let y = MAX_Y; y >= MIN_Y; y--) {
    h += `<tr><td class="y">${y}</td>`;
    for (let m = 1; m <= 12; m++) {
      const n = (cell.get(y * 100 + m) || { size: 0 }).size;
      h += n ? `<td style="background:${heatColor(n / max)}">${n}</td>` : `<td></td>`;
    }
    h += `</tr>`;
  }
  return { html: h + `</tbody></table>`, max };
}
function topPlacesSection(list) {
  if (S.redact) return "";
  const byPlace = new Map();
  for (const o of list) {
    let r = byPlace.get(o.p);
    if (!r) { r = { p: o.p, sp: new Set() }; byPlace.set(o.p, r); }
    r.sp.add(o.s);
  }
  const rows = [...byPlace.values()].sort((a, b) => b.sp.size - a.sp.size).slice(0, 10);
  if (!rows.length) return "";
  const max = rows[0].sp.size;
  return `<h2>${t("topPlaces")}</h2>
    <p class="prose">${t("topPlacesHelp")}</p>
    <div class="card hbar">${rows.map((r, i) => {
      const c = `var(${CHART_PALETTE[i % CHART_PALETTE.length]})`;
      return `<div class="hbar-row"><span class="lbl">${esc(placeName(r.p))}</span><div class="bar"><i style="width:${r.sp.size / max * 100}%;background:linear-gradient(90deg,color-mix(in srgb,${c} 45%,transparent),${c})"></i></div><span class="num">${r.sp.size}</span></div>`;
    }).join("")}</div>`;
}
function calendarSection(list, statsAll) {
  const year = S.year;
  const dayData = new Map();
  for (const o of list) {
    if (o.y !== year) continue;
    if (!dayData.has(o.d)) dayData.set(o.d, new Set());
    dayData.get(o.d).add(o.s);
  }
  if (!dayData.size) return "";
  let max = 1;
  for (const sp of dayData.values()) max = Math.max(max, sp.size);
  const liferDays = new Set([...statsAll.values()].filter(r => r.first.y === year).map(r => r.first.d));
  const dowLetters = T.weekdays.map(w => w[0]);
  const months = T.months.map((name, mi) => {
    const m = mi + 1;
    const first = new Date(Date.UTC(year, mi, 1));
    const startDow = (first.getUTCDay() + 6) % 7;  // 0 = Monday
    const daysInMonth = new Date(Date.UTC(year, mi + 1, 0)).getUTCDate();
    let cells = "";
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-day cal-empty"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${pad(m)}-${pad(day)}`;
      const sp = dayData.get(dateStr);
      const n = sp ? sp.size : 0;
      const lifer = liferDays.has(dateStr);
      const bg = n ? heatColor(n / max) : "var(--bar-soft)";
      const title = n ? `${fmtD(dateStr)}: ${n} ${t("mapSpecies")}${lifer ? " · " + t("newBadge") : ""}` : fmtD(dateStr);
      cells += `<div class="cal-day${lifer ? " cal-lifer" : ""}" style="background:${bg}" title="${esc(title)}"></div>`;
    }
    return `<div class="cal-month"><h4>${name}</h4>
      <div class="cal-grid">${dowLetters.map(l => `<span class="cal-dow">${l}</span>`).join("")}${cells}</div></div>`;
  }).join("");
  return `<h2>${t("calTitle", year)}</h2>
    <p class="prose">${t("calHelp")}</p>
    <div class="card"><div class="cal-months-wrap">${months}</div></div>
    ${heatLegend(max)}`;
}
function renderOverview() {
  const list = regionObs(baseObs());
  if (!list.length) { $("tab-overview").innerHTML = `<p class="empty">${t("noData")}</p>`; return; }
  const stats = speciesStats(list);
  const days = new Set(list.map(o => o.d)).size, places = new Set(list.map(o => o.p)).size;
  const rows = yearRows(list, stats);
  const newYear = rows.find(r => r.y === S.year)?.lifers || 0;
  const c30 = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - 30);  // local dates, like the export
  const cutoff = c30.getFullYear() + "-" + pad(c30.getMonth() + 1) + "-" + pad(c30.getDate());
  const new30 = [...stats.values()].filter(r => r.first.d >= cutoff).length;
  const first = list[0].d, last = list[list.length - 1].d;
  const chrono = numberLifers(stats);
  const latest = chrono.slice(-10).reverse();
  const monthLabel = T.months[S.month - 1];
  const photoPct = pctDisplay(list.filter(o => o.ph).length, list.length);
  const dayMap = new Map();
  for (const o of list) { if (!dayMap.has(o.d)) dayMap.set(o.d, new Set()); dayMap.get(o.d).add(o.s); }
  let bestDay = list[0].d, bestCount = 0;
  for (const [d, sp] of dayMap) if (sp.size > bestCount) { bestCount = sp.size; bestDay = d; }
  const heatT = heatTable(list);
  $("tab-overview").innerHTML = `
    <div class="kpis">
      <div class="kpi main"><b>${fmtN(stats.size)}</b><span>${t("speciesLife")}</span></div>
      <div class="kpi"><b>${fmtN(list.length)}</b><span>${t("observations")}</span></div>
      <div class="kpi"><b>${fmtN(days)}</b><span>${t("days")}</span></div>
      <div class="kpi"><b>${fmtN(places)}</b><span>${t("places")}</span></div>
      <div class="kpi"><b>+${newYear}</b><span>${t("newInYear", S.year)}</span></div>
      <div class="kpi"><b>+${new30}</b><span>${t("newLast30")}</span></div>
      <div class="kpi"><b>${photoPct}%</b><span>${t("photoShare")}</span></div>
      <div class="kpi"><b>${bestCount}</b><span>${t("bestDay", fmtD(bestDay))}</span></div>
    </div>
    <p class="sub" style="margin-top:8px">${t("period")}: ${fmtD(first)} ${t("to")} ${fmtD(last)}</p>
    ${calendarSection(list, stats)}
    <h2>${t("perYear")}</h2>
    <p class="prose">${t("perYearHelp", shortMD(TODAY_MD))}</p>
    ${renderYearBlock(rows, { showYtd: true, showNew: true })}
    <h2>${t("perMonth", monthLabel)}</h2>
    ${renderYearBlock(monthRows(list), { showYtd: S.month === TODAY_M, showNew: false })}
    <h2>${t("curve")}</h2>
    <p class="prose">${t("curveHelp")}</p>
    <div class="card">${curveSvg(chrono)}</div>
    <h2>${t("heat")}</h2>
    <div class="card">${heatT.html}</div>
    ${heatLegend(heatT.max)}
    <h2>${t("latest")}</h2>
    <p class="prose">${t("latestHelp")}</p>
    <div class="card"><table><tbody>${latest.map(r => `<tr><td class="nr">${r.nr}</td>
      <td>${esc(SP[r.s].name)}<span class="latin">${esc(SP[r.s].latin)}</span></td>
      <td class="num">${fmtD(r.first.d)}<span class="small">${esc(placeName(r.first.p))}</span></td></tr>`).join("")}</tbody></table></div>
    ${topPlacesSection(list)}
    ${atlasSection(list, stats)}`;
}

/* ---------- life list ---------- */
function atlasBadge(r) {
  if (!r.ac) return "";
  return `<span class="ab ab-${r.ac[0]}" title="${esc(atlasText(r.ac))}">${esc(r.ac)}</span>`;
}
function atlasDesc(code) {
  return T.atlasCodes[code] ?? T.atlasCats[code] ?? "";
}
function atlasText(code) {
  return code + ": " + atlasDesc(code);
}
function atlasProportionBar(cat) {
  const total = cat.A.length + cat.B.length + cat.C.length;
  if (!total) return "";
  const segs = [["C", cat.C.length, "var(--accent)"], ["B", cat.B.length, "#d18a1b"], ["A", cat.A.length, "#8a949d"]];
  return `<div class="propbar">${segs.map(([k, n, color]) => n
    ? `<div style="width:${n / total * 100}%;background:${color}" title="${esc(T.atlasCats[k])}: ${n}"></div>` : "").join("")}</div>`;
}
function atlasSection(list, stats) {
  const cat = { A: [], B: [], C: [] };
  for (const r of stats.values()) if (r.ac) cat[r.ac[0]].push(r);
  const withCode = cat.A.length + cat.B.length + cat.C.length;
  const rows = [...cat.C, ...cat.B].sort((a, b) => b.ar - a.ar || byDateDesc(a.acObs.d, b.acObs.d));
  const nObs = list.filter(o => o.ar).length;
  return `<h2>${t("atlasTitle")}</h2>
    <p class="prose">${t("atlasHelp", fmtN(nObs), fmtN(list.length))}</p>
    <div class="kpis">
      <div class="kpi"><b>${cat.C.length}</b><span>${t("atlasC")}</span></div>
      <div class="kpi"><b>${cat.B.length}</b><span>${t("atlasB")}</span></div>
      <div class="kpi"><b>${cat.A.length}</b><span>${t("atlasA")}</span></div>
      <div class="kpi"><b>${withCode}</b><span>${t("atlasAny")}</span></div>
    </div>
    ${atlasProportionBar(cat)}
    ${rows.length ? `<div class="card" style="margin-top:10px"><table><thead><tr><th>${t("name")}</th><th>${t("atlasBest")}</th><th class="hide-sm">${t("atlasWhen")}</th></tr></thead><tbody>${rows.map(r =>
      `<tr><td>${esc(SP[r.s].name)}<span class="latin">${esc(SP[r.s].latin)}</span></td>
       <td>${atlasBadge(r)}<span class="small">${esc(atlasDesc(r.ac))}</span></td>
       <td class="hide-sm">${fmtD(r.acObs.d)}<span class="small">${esc(placeName(r.acObs.p))}</span></td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
function renderList() {
  const list = regionObs(baseObs());
  const stats = speciesStats(list);
  // life number by first date (ties broken by taxonomic order)
  const chrono = numberLifers(stats);
  const q = S.q.trim().toLowerCase();
  const af = S.atlasF;
  let rows = chrono.filter(r => (!q || SP[r.s].name.toLowerCase().includes(q) || SP[r.s].latin.toLowerCase().includes(q))
    && (af === "all" || (af === "any" ? r.ac : af === "none" ? !r.ac : r.ac[0] === af)));
  const cmp = {
    nr: (a, b) => a.nr - b.nr,
    first: (a, b) => (a.first.d < b.first.d ? -1 : a.first.d > b.first.d ? 1 : 0) || a.nr - b.nr,
    taxon: (a, b) => SP[a.s].order - SP[b.s].order,
    name: (a, b) => collator.compare(SP[a.s].name, SP[b.s].name),
    last: (a, b) => a.last.d < b.last.d ? -1 : a.last.d > b.last.d ? 1 : 0,
    n: (a, b) => a.n - b.n,
    max: (a, b) => a.max - b.max,
    years: (a, b) => a.years.size - b.years.size,
    atlas: (a, b) => a.ar - b.ar,
  }[S.sort];
  rows.sort((a, b) => S.dir * cmp(a, b));
  const th = (key, label, cls = "") => `<th class="sortable ${cls}${S.sort === key ? " sorted" : ""}" data-sort="${key}">${label}${S.sort === key ? (S.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  let h = `<p class="sub" style="margin:4px 4px 6px">${t("hits", rows.length, stats.size)}</p>
    <table><thead><tr>${th("nr", t("nr"))}${th("name", t("name"))}${th("first", t("first"), "hide-sm")}${th("last", t("last"), "hide-sm")}${th("n", t("obsShort"), "num")}${th("max", t("max"), "num hide-sm")}${th("years", t("yearsShort"), "num hide-sm")}${th("atlas", t("colAtlas"))}</tr></thead><tbody>`;

// Chart.js is fetched lazily and only upgrades the hand-drawn SVG bar chart already in the card;
// offline or a blocked CDN just leaves the SVG in place, so the page never depends on it.
const CHARTJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js";
let chartjsLoading = null;
function loadChartJs() {
  if (typeof Chart !== "undefined") return Promise.resolve();
  if (!chartjsLoading) {
    chartjsLoading = new Promise((resolve, reject) => {
      const js = document.createElement("script");
      js.src = CHARTJS_URL;
      js.onload = resolve;
      js.onerror = () => { chartjsLoading = null; js.remove(); reject(new Error("chartjs")); };

  loadChartJs().then(() => {
    if (!document.body.contains(card)) return;  // page moved on before the library arrived
    if (BAR_CHARTS[card.id]) { BAR_CHARTS[card.id].destroy(); delete BAR_CHARTS[card.id]; }
    const style = getComputedStyle(document.documentElement);
    const palette = CHART_PALETTE.map(v => style.getPropertyValue(v).trim());

    card.append(box);
    BAR_CHARTS[card.id] = new Chart(canvas, {
      type: "bar",
      data: { labels, datasets: [{
        data: values,
        backgroundColor: values.map((v, i) => hue(v, i) + "cc"),
        hoverBackgroundColor: values.map((v, i) => hue(v, i)),

        plugins: { legend: { display: false }, tooltip: tips ? { callbacks: { title: items => tips[items[0].dataIndex] } } : {} },

      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = LEAFLET_URL + ".css";
      const js = document.createElement("script");
      js.src = LEAFLET_URL + ".js";
      js.onload = () => {
        const cluster = document.createElement("script");
        cluster.src = CLUSTER_URL;
        // clustering is a nice-to-have on top of core Leaflet: if only this CDN request fails, still resolve
        // so the map renders with drawMap()'s plain-layerGroup fallback instead of the whole map being disabled
        cluster.onload = resolve;
        cluster.onerror = resolve;
        document.head.append(cluster);
      };
      js.onerror = () => { leafletLoading = null; css.remove(); reject(new Error("leaflet")); };
      document.head.append(css, ...links, js);
    });
  }
  return leafletLoading;
}
function renderMap() {
  $("map-note").textContent = "";
  loadLeaflet().then(() => { if (S.tab === "map") drawMap(); },
    () => { if (!MAP) $("map").innerHTML = `<p class="empty">${t("mapNoLib")}</p>`; });
}
function drawMap() {
  const box = $("map");
  if (!MAP) {
    box.innerHTML = "";
    MAP = L.map(box);
    const esri = "&copy; Esri, HERE, Garmin, OpenStreetMap-Mitwirkende";
    const layers = {
      [t("mapStreets")]: L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: esri }),
      [t("mapTopo")]: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, subdomains: "abc", attribution: "Kartendaten &copy; OpenStreetMap-Mitwirkende, SRTM, Darstellung &copy; OpenTopoMap (CC-BY-SA)" }),
      [t("mapSat")]: L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "&copy; Esri, Maxar, Earthstar Geographics" }),
    };
    Object.values(layers)[0].addTo(MAP);
    L.control.layers(layers, null, { position: "topright" }).addTo(MAP);
    MAP_LAYER = L.markerClusterGroup
      ? L.markerClusterGroup({
          maxClusterRadius: 45,
          iconCreateFunction: cl => L.divIcon({
            html: `<div>${cl.getChildCount()}</div>`, className: "marker-cluster-custom", iconSize: [36, 36],
          }),
        })
      : L.layerGroup();
    MAP_LAYER.addTo(MAP);
  }
  $("m-metric").options[1].text = t("mapYear", S.year);
  $("m-metric").options[3].text = t("mapLifer", S.year);
  MAP.invalidateSize();
  MAP_LAYER.clearLayers();
  const regionList = regionObs(baseObs());
  const byPlace = new Map();
  for (const o of regionList) {
    let r = byPlace.get(o.p);
    if (!r) { r = { p: o.p, sp: new Set(), ySp: new Set(), n: 0, first: o.d, last: o.d, visits: new Map(), lifer: 0 }; byPlace.set(o.p, r); }
    r.sp.add(o.s); r.n++; r.last = o.d;
    if (o.y === S.year) r.ySp.add(o.s);
    if (!r.visits.has(o.d)) r.visits.set(o.d, []);
    r.visits.get(o.d).push(o);
  }
  // species whose first-ever record (across all years) falls at this place, up to the selected year: powers the "lifer time travel" metric.
  // OBS is already date-sorted ascending, so the first entry seen per species here is its earliest record — cheaper than a full speciesStats() pass.
  const firstOfSpecies = new Map();
  for (const o of regionList) if (!firstOfSpecies.has(o.s)) firstOfSpecies.set(o.s, o);
  for (const first of firstOfSpecies.values()) {
    if (first.y > S.year) continue;
    const r = byPlace.get(first.p);
    if (r) r.lifer++;
  }
  const value = r => S.metric === "year" ? r.ySp.size : S.metric === "obs" ? r.n : S.metric === "lifer" ? r.lifer : r.sp.size;
  const pts = [...byPlace.values()].filter(r => PL[r.p].lat && value(r) > 0).sort((a, b) => value(b) - value(a));
  $("map-note").textContent = t("mapNote", pts.length);
  if (!pts.length) return;
  const max = value(pts[0]);
  const bounds = [];
  for (const r of pts) {
    const p = PL[r.p], v = value(r);
    const visits = [...r.visits].sort((a, b) => byDateDesc(a[0], b[0]));
    const visitList = visits.map(([d, obs]) => `<details><summary>${fmtD(d)} (${obs.length})</summary><ul>${obs
      .map(o => `<li>${esc(SP[o.s].name)}${o.c ? ` (${o.c})` : ""}${o.ph ? " 📷" : ""}</li>`).join("")}</ul></details>`).join("");
    // a plain div-icon marker (not circleMarker) so the cluster plugin, which only understands L.Marker, can group these
    const dia = Math.round(2 * (5 + 17 * Math.sqrt(v / max)));
    const icon = L.divIcon({
      className: "value-marker",
      html: `<div style="width:${dia}px;height:${dia}px;background:${heatColor(v / max)};opacity:.8;border:1.5px solid rgba(0,0,0,.35);border-radius:50%"></div>`,
      iconSize: [dia, dia], iconAnchor: [dia / 2, dia / 2],
    });
    L.marker([p.lat, p.lon], { icon })
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.muni)}<br>${t("mapSpecies")}: ${r.sp.size}, ${t("observations")}: ${r.n}${r.lifer ? `, ${t("mapLifeHere")}: ${r.lifer}` : ""}<br>${fmtD(r.first)} ${t("to")} ${fmtD(r.last)}
        <div class="visits">${visitList}</div>
        <button class="lnk" data-region="p:${p.i}">${t("mapFilter")}</button>`, { maxWidth: 280 })
      .bindTooltip(`${esc(p.name)}: ${v}`)
      .addTo(MAP_LAYER);
    bounds.push([p.lat, p.lon]);
  }
  MAP.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
}

/* ---------- chrome ---------- */
function buildRegionSelect() {
  const base = baseObs(), groups = { s: new Map(), c: new Map(), m: new Map() };
  for (const o of base) {
    const p = PL[o.p];
    for (const g of ["s", "c", "m"]) {
      const k = p.keys[g];
      if (!groups[g].has(k)) groups[g].set(k, { name: g === "s" ? stateName(p.state || "?") : g === "c" ? countyName(p.keys.c) : (p.muni || T.unknown), sp: new Set() });
      groups[g].get(k).sp.add(o.s);
    }
  }
  const opt = (g, k, v) => `<option value="${g}:${esc(k)}">${esc(v.name)} (${v.sp.size})</option>`;
  const grp = (g, title) => {
    const items = [...groups[g]].sort((a, b) => b[1].sp.size - a[1].sp.size);
    return `<optgroup label="${t(title)}">${items.map(([k, v]) => opt(g, k, v)).join("")}</optgroup>`;
  };
  const sel = $("f-region");
  sel.innerHTML = `<option value="all">${t("regionAll")}</option>` + grp("s", "grpState") + grp("c", "grpCounty") + (S.redact ? "" : grp("m", "grpMuni"));
  if (S.region.startsWith("p:") && PL[+S.region.slice(2)]) {
    sel.insertAdjacentHTML("beforeend", `<optgroup label="${t("grpPlace")}"><option value="${S.region}">${esc(PL[+S.region.slice(2)].name)}</option></optgroup>`);
  }
  sel.value = [...sel.options].some(o => o.value === S.region) ? S.region : "all";
  S.region = sel.value;
}
function applyRedact(on) {
  S.redact = on;
  $("o-redact").checked = on;
  document.querySelector('#tabs button[data-tab="map"]').hidden = on;
  if (on && /^[pm]:/.test(S.region)) S.region = "all";
  if (on && S.tab === "map") { S.tab = "overview"; }
  // drop everything rendered with place names; each tab re-renders when it is shown
  for (const id of ["tab-overview", "list-out", "tab-regions", "tab-targets"]) $(id).innerHTML = "";
  if (MAP_LAYER) MAP_LAYER.clearLayers();
  $("map-note").textContent = "";
  buildRegionSelect();
  setTab(S.tab);
}
function setTab(tab) {
  S.tab = tab;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  for (const s of document.querySelectorAll("section.tab")) s.classList.toggle("on", s.id === "tab-" + tab);
  try { history.replaceState(null, "", "#" + tab); } catch (e) { /* file: URLs may refuse */ }
  renderActive();
}
function renderActive() {
  ({ overview: renderOverview, list: renderList, regions: renderRegions, targets: renderTargets, activity: renderActivity, map: renderMap })[S.tab]();
}
function refreshAll() { buildRegionSelect(); renderActive(); }

// (re-)sets every static label, option list and select value from the active language; safe to call again after a language switch
function renderChrome() {
  $("h-title").textContent = t("title");
  $("h-sub").textContent = t("subtitle", RAW.meta.source, fmtN(OBS.length)) + " · " + t("version", APP_VERSION);
  $("o-sum").textContent = t("optsSummary");
  $("o-escaped-t").textContent = t("optEscaped");
  $("o-collective-t").textContent = t("optCollective");
  $("o-redact-t").textContent = t("optRedact");
  $("o-redact-l").hidden = !!RAW.meta.redacted;
  $("q").placeholder = t("searchPh");
  $("tabs").innerHTML = [["overview", "tabOverview"], ["list", "tabList"], ["regions", "tabRegions"], ["targets", "tabTargets"], ["activity", "tabActivity"], ["map", "tabMap"]]
    .map(([k, l]) => `<button data-tab="${k}">${t(l)}</button>`).join("");
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === S.tab);
  if (S.redact) document.querySelector('#tabs button[data-tab="map"]').hidden = true;
  $("f-lang").value = S.lang;
  $("f-region").setAttribute("aria-label", t("ariaRegion"));
  $("f-year").setAttribute("aria-label", t("ariaYear"));
  $("f-month").setAttribute("aria-label", t("ariaMonth"));
  $("q-sort").setAttribute("aria-label", t("ariaSort"));
  $("q-atlas").setAttribute("aria-label", t("ariaAtlas"));
  $("a-metric").setAttribute("aria-label", t("ariaMetric"));
  $("a-scope").setAttribute("aria-label", t("ariaScope"));
  $("m-metric").setAttribute("aria-label", t("ariaMapMetric"));
  $("f-year").innerHTML = YEARS.slice().reverse().map(y => `<option>${y}</option>`).join("");
  $("f-year").value = S.year;
  $("f-month").innerHTML = T.months.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  $("f-month").value = S.month;
  $("q-sort").innerHTML = ["nr", "taxon", "name"].map(k => `<option value="${k}">${t("sort" + k[0].toUpperCase() + k.slice(1))}</option>`).join("") + `<option value="" disabled>${t("sortColumn")}</option>`;
  $("q-sort").value = ["nr", "taxon", "name"].includes(S.sort) ? S.sort : "";
  $("a-metric").innerHTML = [["obs", "actMObs"], ["species", "actMSpecies"], ["days", "actMDays"]].map(([k, l]) => `<option value="${k}">${t(l)}</option>`).join("");
  $("a-metric").value = S.actMetric;
  $("a-scope").innerHTML = `<option value="all">${t("actScopeAll")}</option><option value="year">${S.actScope === "year" ? t("actScopeYear", S.year) : ""}</option>`;
  $("a-scope").value = S.actScope;
  $("q-atlas").innerHTML = Object.entries(T.atlasFilter).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  $("q-atlas").value = S.atlasF;
  $("b-pdf").textContent = t("pdf");
  $("m-metric").innerHTML = `<option value="life">${t("mapLife")}</option><option value="year">${S.metric === "year" ? t("mapYear", S.year) : t("mapYear", t("yearPlaceholder"))}</option><option value="obs">${t("mapObs")}</option><option value="lifer">${S.metric === "lifer" ? t("mapLifer", S.year) : t("mapLifer", t("yearPlaceholder"))}</option>`;
  $("m-metric").value = S.metric;
  $("m-year").min = MIN_Y; $("m-year").max = MAX_Y; $("m-year").value = S.year;
  $("m-year").setAttribute("aria-label", t("ariaYear"));
  $("m-year-val").textContent = S.year;
}
function applyLang(lang) {
  if (lang === S.lang) return;
  S.lang = lang;
  T = STR[lang];
  collator = new Intl.Collator(lang === "en" ? "en" : "de");
  try { localStorage.setItem("lifelist-lang", lang); } catch (e) { /* private mode may refuse */ }
  document.documentElement.lang = lang;
  document.title = t("title");
  renderChrome();
  buildRegionSelect();
  renderActive();
}
function init() {
  document.documentElement.lang = S.lang;
  document.title = t("title");
  renderChrome();

  $("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
  $("f-lang").addEventListener("change", e => { applyLang(e.target.value); });
  $("f-region").addEventListener("change", e => { S.region = e.target.value; renderActive(); });
  $("f-year").addEventListener("change", e => { S.year = +e.target.value; renderActive(); });
  $("f-month").addEventListener("change", e => { S.month = +e.target.value; renderActive(); });
  $("o-escaped").addEventListener("change", e => { S.escaped = e.target.checked; refreshAll(); });
  $("o-collective").addEventListener("change", e => { S.collective = e.target.checked; refreshAll(); });
  $("o-redact").addEventListener("change", e => { applyRedact(e.target.checked); });
  $("q").addEventListener("input", e => { S.q = e.target.value; renderList(); });
  $("q-sort").addEventListener("change", e => { S.sort = e.target.value; S.dir = S.sort === "nr" ? -1 : 1; renderList(); });
  $("a-metric").addEventListener("change", e => { S.actMetric = e.target.value; renderActivity(); });
  $("a-scope").addEventListener("change", e => { S.actScope = e.target.value; renderActivity(); });
  $("q-atlas").addEventListener("change", e => { S.atlasF = e.target.value; renderList(); });
  $("b-pdf").addEventListener("click", () => window.print());
  let printBackup = null;
  window.addEventListener("beforeprint", () => {
    // the report contains every section in full: no open detail rows, search, atlas filter, truncated region tables or wishlist source filter
    printBackup = { q: S.q, open: S.open, atlasF: S.atlasF, regAll: S.regAll, targetSrc: S.targetSrc };
    S.q = ""; S.open = new Set(); S.atlasF = "all"; S.regAll = Object.fromEntries(LEVELS.map(lv => [lv.lvl, true])); S.targetSrc = "all";
    $("h-print").textContent = t("printed", new Date().toLocaleDateString(S.lang === "en" ? "en-GB" : "de-DE")) + (S.region === "all" ? "" : ", " + $("f-region").selectedOptions[0].text);
    renderOverview(); renderList(); renderRegions(); renderTargets(); renderActivity();
  });
  window.addEventListener("afterprint", () => {
    if (printBackup) { Object.assign(S, printBackup); printBackup = null; }
    renderActive();
  });
  $("m-metric").addEventListener("change", e => { S.metric = e.target.value; renderMap(); });
  $("m-year").addEventListener("input", e => {
    S.year = +e.target.value;
    $("m-year-val").textContent = S.year;
    $("f-year").value = S.year;
    // MAP may still be loading (or have failed to load) while the user drags; and rAF-throttle redraws during the drag itself
    if ((S.metric === "year" || S.metric === "lifer") && MAP) {
      if (mapYearRAF) cancelAnimationFrame(mapYearRAF);
      mapYearRAF = requestAnimationFrame(() => { mapYearRAF = null; drawMap(); });
    }
  });
  $("tab-map").addEventListener("click", e => {
    const r = e.target.closest("[data-region]");
    if (r) { S.region = r.dataset.region; buildRegionSelect(); renderMap(); }
  });

  $("list-out").addEventListener("click", e => {
    const th = e.target.closest("th[data-sort]");
    if (th) {
      const k = th.dataset.sort;
      if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = k === "name" || k === "taxon" ? 1 : -1; }
      renderList(); return;
    }
    const tr = e.target.closest("tr.row");
    if (tr) { const s = +tr.dataset.sp; S.open.has(s) ? S.open.delete(s) : S.open.add(s); renderList(); }
  });
  $("tab-regions").addEventListener("click", e => {
    const th = e.target.closest("th[data-lvl]");
    if (th) {
      const cur = S.regSort[th.dataset.lvl] || { k: "life", d: -1 };
      S.regSort[th.dataset.lvl] = cur.k === th.dataset.k ? { k: cur.k, d: -cur.d } : { k: th.dataset.k, d: th.dataset.k === "name" ? 1 : -1 };
      renderRegions(); return;
    }
    const more = e.target.closest("[data-more]");
    if (more) { S.regAll[more.dataset.more] = !S.regAll[more.dataset.more]; renderRegions(); return; }
    const r = e.target.closest("[data-region]");
    if (r) {
      S.region = r.dataset.region;
      buildRegionSelect();
      setTab("overview");
    }
  });

  $("tab-targets").addEventListener("change", e => {
    if (e.target.id === "tgt-src") { S.targetSrc = e.target.value; renderTargets(); }
  });
  $("tab-targets").addEventListener("click", e => {
    if (e.target.closest("#tgt-add")) {
      const input = $("tgt-search"), val = input.value.trim();
      if (val) {
        const match = EURO_BY_NAME.get(val.toLowerCase());
        const dup = S.customTargets.some(x => x.name.toLowerCase() === (match ? match[1] : val).toLowerCase());
        if (!dup) S.customTargets.push(match ? { name: match[1], latin: match[0] } : { name: val, latin: null });
        saveCustomTargets();
        input.value = "";
        renderTargets();
      }
      return;
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) { S.customTargets.splice(+rm.dataset.remove, 1); saveCustomTargets(); renderTargets(); }
  });

  if (S.redact) { $("o-redact").checked = true; document.querySelector('#tabs button[data-tab="map"]').hidden = true; }
  const hash = location.hash.slice(1);
  buildRegionSelect();
  const tabs = ["overview", "list", "regions", "targets", "activity"].concat(S.redact ? [] : ["map"]);
  setTab(tabs.includes(hash) ? hash : "overview");
}
init();
</script>

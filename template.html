<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Lebensliste</title>
<style>
:root{
  --bg:#f7f8f6; --card:#ffffff; --text:#1d2521; --muted:#6a746e; --line:#e4e8e4;
  --accent:#2f8f4e; --accent-soft:#eaf4ed; --bar:#4a86b6; --bar-soft:#dbe7f0;
  --hl:#fff7cc; --link:#3d6a8c; --stripe:#f6f8f5;
  --k1:#2f8f4e; --k2:#c98a1b; --k3:#3d78a8; --k4:#8659b3; --k5:#c1554a; --k6:#2f9e93;
  --heat-lo:#dcefe2; --heat-hi:#1a6334; --heat-ink:#fff;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 3px 10px rgba(20,32,26,.04);
  --mk-lo:#f6c36b; --mk-hi:#b8420f; --cal-empty:#e8ece8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1b201d; --text:#e8ece9; --muted:#96a19a; --line:#2c332f;
    --accent:#4cc275; --accent-soft:#1f3327; --bar:#5b9bcf; --bar-soft:#2b3b48;
    --hl:#3b3717; --link:#8ab8dc; --stripe:#202622;
    --k1:#4cc275; --k2:#e0a23c; --k3:#5b9bcf; --k4:#b28ee0; --k5:#e08578; --k6:#4cc2b3;
    --heat-lo:#1f3a2a; --heat-hi:#7ee0a2; --heat-ink:#0f2418;
    --shadow:none; --cal-empty:#252c28;
  }
}
/* explicit override from the theme select in Einstellungen, regardless of OS preference */
:root[data-theme="dark"]{
  --bg:#121614; --card:#1b201d; --text:#e8ece9; --muted:#96a19a; --line:#2c332f;
  --accent:#4cc275; --accent-soft:#1f3327; --bar:#5b9bcf; --bar-soft:#2b3b48;
  --hl:#3b3717; --link:#8ab8dc; --stripe:#202622;
  --k1:#4cc275; --k2:#e0a23c; --k3:#5b9bcf; --k4:#b28ee0; --k5:#e08578; --k6:#4cc2b3;
  --heat-lo:#1f3a2a; --heat-hi:#7ee0a2; --heat-ink:#0f2418;
  --shadow:none; --cal-empty:#252c28;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
@media (prefers-reduced-motion:reduce){::view-transition-group(*){animation:none!important}}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-top:10px}
h1{font-size:1.15rem;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
h1 .logo{width:26px;height:26px;fill:var(--accent);flex:0 0 auto}
h1 .logo .eye{fill:var(--card)}
h1 .logo .wing{fill:color-mix(in srgb,var(--accent) 70%,#000)}
h1 .logo .legs{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:round}
.sub{color:var(--muted);font-size:.78rem;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=search]{font:inherit;font-size:.82rem;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);color:var(--text);max-width:100%}
input[type=search]{min-width:0;flex:1 1 200px}
details.opts{position:relative;font-size:.8rem;color:var(--muted)}
details.opts summary{cursor:pointer;border-radius:5px;padding:2px 4px;margin:-2px -4px;transition:background-color .12s ease,color .12s ease}
details.opts summary:hover{background:var(--stripe);color:var(--text)}
details.opts .opts-panel{position:absolute;bottom:100%;right:0;margin-bottom:6px;padding:8px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);white-space:nowrap;z-index:21}
details.opts label{display:block;margin:5px 0}
details.opts .opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;margin-bottom:5px;border-bottom:1px solid var(--line)}
details.opts .opt-row select{font:inherit;font-size:.8rem;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--text)}
nav.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav.tabs button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--muted);
  padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .12s ease,border-color .12s ease}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:not(.on):hover{color:var(--text);border-bottom-color:var(--line)}
section.tab{display:none;padding-top:16px}
section.tab.on{display:block}
h2{font-size:.95rem;line-height:1.4;margin:30px 0 10px;scroll-margin-top:calc(var(--header-h, 167px) + 14px)}
h2 small{font-weight:400;color:var(--muted);margin-left:6px}
h2 .ctl{font-weight:400;font-size:.8rem;color:var(--muted);margin-left:10px}
h2 .ctl select{margin-left:4px}
.prose{color:var(--muted);font-size:.78rem;text-align:justify;hyphens:auto;margin:3px 0 12px}
details.info{margin:2px 0 10px}
/* right after a heading the toggle moves up into the heading's own line, at the right end */
h2 + details.info{margin-top:-30px;text-align:right}
h2 + details.info[open]{margin-bottom:12px}
h2 + details.info p.prose{text-align:justify}
details.info summary{cursor:pointer;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;list-style:none;display:inline-block;transition:color .12s ease}
details.info summary:hover{color:var(--accent)}
details.info summary::-webkit-details-marker{display:none}
details.info summary::before{content:"ⓘ ";font-size:1.05em}
details.info p.prose{margin:5px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.k8{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.kpis.k8{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.55rem;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:.76rem;line-height:1.3;display:block;margin-top:3px}
.kpi.main{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.kpi.main b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;overflow-x:auto;box-shadow:var(--shadow)}
.toc{position:fixed;left:calc(50vw - 684px);top:calc(var(--header-h, 167px) + 14px);z-index:4;
  width:190px;max-height:calc(100vh - var(--header-h, 167px) - 34px);overflow-y:auto;padding:2px 0}
.toc-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin:0 0 6px;padding:0 8px 7px 12px;border-bottom:1px solid var(--line)}
.toc button{display:block;width:100%;text-align:left;background:none;cursor:pointer;
  font:inherit;font-size:.78rem;line-height:1.3;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:6px 8px 6px 12px;border:0;border-left:2px solid var(--line);border-radius:0 6px 6px 0}
.toc button:hover{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:1400px){.toc{display:none!important}}
.yhead,.yrow{display:grid;grid-template-columns:2.6rem 4.2rem 1fr 3rem 2.6rem;gap:8px;align-items:center;padding:4px 6px}
.yhead{color:var(--muted);font-size:.72rem;padding-top:6px}
.yrow{border-radius:6px}
.yrow.cur{background:var(--hl)}
.yrow .y{font-weight:600}
.yrow .ytd{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.yrow .tot{color:var(--accent);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.yrow .new{color:var(--muted);text-align:right;font-size:.78rem;font-variant-numeric:tabular-nums}
.yhead span:nth-child(2),.yhead span:nth-child(4),.yhead span:nth-child(5){text-align:right}
.bar{height:10px;background:var(--bar-soft);border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--bar) 45%,transparent),var(--bar))}
.yrow.cur .bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent))}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;
  padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer;transition:color .12s ease}
th.sortable:hover{color:var(--text)}
th.sorted{color:var(--text)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;transition:background-color .12s ease}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd) td{background:var(--stripe)}
tr.row:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nr{color:var(--muted);width:2rem}
table.rtable{table-layout:fixed}
table.rtable .nr{width:2.2rem}
table.rtable .num{width:6.5rem}
table.rtable .rbar{width:28%;vertical-align:middle}
table.rtable td:not(.nr):not(.num),table.rtable th:not(.nr):not(.num){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.latin{color:var(--muted);font-style:italic;font-size:.74rem;display:block;line-height:1.2}
.small{color:var(--muted);font-size:.74rem;display:block;line-height:1.2}
button.lnk{color:var(--link);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-align:left;border-radius:4px;transition:color .12s ease}
button.lnk:hover{text-decoration:underline;color:var(--accent)}
button.lnk[data-remove]:hover{text-decoration:none;color:var(--k5)}
tr.row{cursor:pointer}
tr.detail td{background:var(--accent-soft)!important;padding:8px}
.pheno{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:54px;max-width:360px}
.pheno div{background:var(--bar);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.pheno-l{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:360px;font-size:.66rem;color:var(--muted);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.74rem}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
table.heat{table-layout:fixed;min-width:560px}
.heat th:first-child{width:3.4rem}
.heat td,.heat th{text-align:center;padding:3px 2px;font-size:.72rem}
.heat td.y{text-align:left;font-weight:600;padding-left:4px}
.heat td{border:1px solid var(--card);border-radius:3px}
.heat td.hot{color:var(--heat-ink)}
.time-chip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
table.wtable td{vertical-align:middle}
table.wtable .strip-cell{width:45%}
.season-strip,.season-months{position:relative;display:block;max-width:300px}
.season-strip{height:12px;border-radius:3px;background:var(--bar-soft);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100% / 12 - 1px),var(--card) calc(100% / 12 - 1px) calc(100% / 12))}
.season-strip i{position:absolute;top:0;bottom:0;border-radius:2px;opacity:.9}
.season-breed i,.season-key.season-breed{background:var(--accent)}
.season-occ i,.season-key.season-occ{background:var(--k3)}
.season-strip b,.season-key.season-today{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text)}
.season-months{display:inline-grid;width:min(300px,calc(100% - 1.4em));vertical-align:middle;grid-template-columns:repeat(12,1fr);text-align:center;letter-spacing:0}
.season-legend{margin:0 2px 8px}
.season-key{display:inline-block;width:14px;height:8px;border-radius:2px;margin-left:8px}
.season-key.season-today{position:static;width:2px;height:12px;margin-left:12px}
tr.grp td{background:none!important;font-weight:600;padding-top:16px;color:var(--text);border-bottom:1px solid var(--line)}
tr.grp td small{font-weight:400;color:var(--muted);margin-left:6px}
.new-badge{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;font-size:.62rem;font-weight:700;margin-left:6px;vertical-align:middle}
.cal-months-wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 14px}
@media (max-width:900px){.cal-months-wrap{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.cal-month h4{margin:0 0 5px;font-size:.76rem;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:.6rem;color:var(--muted);text-align:center;line-height:1.6}
.cal-day{aspect-ratio:1;border-radius:2px;background:var(--bar-soft)}
.cal-day.cal-lifer{box-shadow:0 0 0 2px var(--k2) inset}
.cal-day.cal-empty{background:transparent}
svg.curve{width:100%;height:auto;display:block}
svg.curve text{fill:var(--muted);font-size:11px}
#list-curve{margin-bottom:22px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.empty{color:var(--muted);padding:10px 4px}
.more{margin:8px 0 2px}
/* own stacking context: Leaflet's panes/controls use z-index 400-1000 and would otherwise cover the fixed footer */
#map{height:70vh;min-height:360px;border-radius:12px;border:1px solid var(--line);isolation:isolate;box-shadow:var(--shadow)}
/* map furniture stays light in both themes, like the tiles underneath */
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif;color:#1d2521;margin:12px 14px}
.leaflet-popup-content .pop-h{font-weight:700;font-size:14px;line-height:1.25;padding-right:10px}
.leaflet-popup-content .pop-sub{color:#6a746e;font-size:12px}
.leaflet-popup-content .pop-stats{display:flex;gap:6px;margin:8px 0 6px}
.leaflet-popup-content .pop-stats span{flex:1;background:#f1f5f2;border-radius:7px;padding:5px 8px;font-size:11px;color:#6a746e;line-height:1.2}
.leaflet-popup-content .pop-stats b{display:block;font-size:15px;color:#1d2521}
.leaflet-popup-content .visits{max-height:190px;overflow:auto;margin:8px 0 6px;border-top:1px solid #e4e8e4;padding-top:6px}
.leaflet-popup-content .visits details{margin:2px 0}
.leaflet-popup-content .visits summary{cursor:pointer}
.leaflet-popup-content .visits ul{margin:2px 0 4px;padding-left:18px}
.leaflet-popup-content .lnk{color:#3d6a8c}
.leaflet-tooltip{font:12px/1.3 system-ui,sans-serif;border-radius:6px}
.marker-cluster-custom div{background:var(--k3);color:#fff;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 system-ui,sans-serif;width:100%;height:100%;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .12s ease}
.marker-cluster-custom:hover div{transform:scale(1.12)}
/* Leaflet sets marker z-index inline (small places are lifted above big ones); clusters stay on top of both */
.leaflet-marker-icon.marker-cluster-custom{z-index:5000!important}
.value-marker .dot{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);box-sizing:border-box}
.map-legend{background:rgba(255,255,255,.94);color:#1d2521;padding:8px 12px;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.2);font:12px/1.3 system-ui,sans-serif}
.map-legend b{display:block;margin-bottom:6px}
.map-legend-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.map-legend.no-cluster .cluster-key{display:none}
.map-legend-row span{display:flex;align-items:center;gap:5px}
.map-legend .dot{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);box-sizing:border-box}
.map-legend-cluster{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--k3);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);box-sizing:border-box}
/* hover targets the inner circle div, not the outer .value-marker wrapper: Leaflet positions that
   wrapper via its own inline transform, and a competing CSS transform there would fight it */
.value-marker > div{transition:transform .12s ease,filter .12s ease}
.value-marker:hover > div{transform:scale(1.18);filter:brightness(1.1)}
.time-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0;margin-top:2px;border-top:1px solid var(--line)}
.time-bar input[type=range]{flex:1 1 200px;min-width:140px;accent-color:var(--accent)}
.time-all{font:inherit;font-size:.78rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;flex:0 0 auto;transition:background-color .12s ease,border-color .12s ease,color .12s ease}
.time-all:not(.on):hover{border-color:var(--accent);color:var(--text)}
.time-all.on{background:var(--accent);border-color:var(--accent);color:#fff}
.time-all.on:hover{background:color-mix(in srgb,var(--accent) 85%,black)}
.time-label{font-weight:700;font-size:1rem;min-width:9ch;text-align:right;color:var(--text);text-shadow:0 1px 1px rgba(0,0,0,.12);flex:0 0 auto}
@media (max-width:700px){
  .hide-sm{display:none}
  header.top{position:static}
  #h-sub{display:none}
  .yhead,.yrow{grid-template-columns:2.4rem 2.8rem 1fr 2.6rem 2.2rem;gap:4px}
}
.ab{display:inline-block;min-width:1.9rem;text-align:center;border-radius:5px;padding:0 5px;font-size:.74rem;font-weight:600;color:#fff}
.ab-A{background:#8a949d}.ab-B{background:#d18a1b}.ab-C{background:#2f8f4e}
.btn{font:inherit;font-size:.82rem;padding:3px 10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;transition:background-color .12s ease,border-color .12s ease}
.btn:hover{background:color-mix(in srgb,var(--accent) 85%,black);border-color:color-mix(in srgb,var(--accent) 85%,black)}
footer.meta-footer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:6px 16px;background:var(--card);border-top:1px solid var(--line)}
footer.meta-footer #h-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer.meta-footer .footer-actions{display:flex;align-items:center;gap:12px;flex:0 0 auto}
footer.meta-footer .btn{flex:0 0 auto;padding:3px 10px}
.legend{display:flex;align-items:center;gap:8px;margin:6px 2px 14px;font-size:.72rem;color:var(--muted)}
.legend .grad{flex:0 0 90px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--heat-hi) 8%,var(--heat-lo)),var(--heat-hi))}
.hbar{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.hbar-row{display:grid;grid-template-columns:minmax(0,16rem) 1fr 2.4rem;gap:10px;align-items:center;font-size:.8rem}
.hbar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.printonly{display:none}
@page{size:A4;margin:14mm}
@media print{
  /* the report is always light on paper, regardless of the UI theme (Einstellungen); !important
     beats the higher-specificity :root[data-theme="dark"] override */
  :root{--bg:#fff!important;--card:#fff!important;--text:#111!important;--muted:#555!important;--line:#ccc!important;--accent:#1f7a3d!important;--accent-soft:#eef6f0!important;
    --bar:#3d78a8!important;--bar-soft:#d3e2ee!important;--hl:#fff!important;--link:#111!important;--stripe:#f5f5f5!important;
    --heat-lo:#dcefe2!important;--heat-hi:#1a6334!important;--heat-ink:#fff!important;--cal-empty:#eef0ee!important}
  body{font-size:10pt}
  header.top{position:static;border:0}
  .filters,nav.tabs,.pick,.time-bar,#tab-map,.more{display:none!important}
  footer.meta-footer{position:static;border:0;padding:10px 0 0;justify-content:flex-start}
  footer.meta-footer .footer-actions{display:none!important}
  .toc{display:none!important}
  .printonly{display:block}
  section.tab{display:block!important;padding-top:0}
  .wrap{max-width:none;padding:0}
  .card,.kpi{overflow:visible;border-color:var(--line);box-shadow:none}
  tr,.yrow,.kpi{break-inside:avoid}
  h2{break-after:avoid;margin-top:14px}
  #tab-list,#tab-regions,#tab-targets,#tab-activity{break-before:page}
  tr.row{cursor:auto}
  .hide-sm{display:revert!important}
  th.hide-sm,td.hide-sm{display:table-cell!important}
